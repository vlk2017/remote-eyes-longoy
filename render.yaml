services:
  - type: web
    name: remote-eyes-longoy
    runtime: python
    plan: free
    buildCommand: python -m zipfile -e source.zip app && pip install -r app/requirements.txt
    startCommand: cd app && uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_BASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.8
